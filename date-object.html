<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object</title>
</head>
<body>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        const a = new Date();
        document.getElementById("demo").innerHTML = a.toString();

        const b = new Date();
        document.getElementById("demo1").innerHTML = b.toUTCString();

        const c = new Date();
        document.getElementById("demo2").innerHTML = c.toDateString();

        const d = new Date();
        document.getElementById("demo3").innerHTML = d.toISOString();
    </script>
</body>
</html>
