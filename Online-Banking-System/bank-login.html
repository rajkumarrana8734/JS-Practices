<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Banking - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bank Login</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Login Name:</label>
                <input type="text" id="bUsername" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="bPassword" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            let uname = document.getElementById("bUsername").value;
            localStorage.setItem("bankUser", uname);
            window.location.href = "bank-account.html";
        }
    </script>
</body>
</html>
