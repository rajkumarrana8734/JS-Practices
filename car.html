
<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Fuel Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            height: 100vh;
            width:100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            border: 1px solid #ccc;
            width: 400px;
            height: 450px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            background-color: aliceblue;
        }
        h2{
            text-align: center;
            text-shadow: 0 10px 15px rgb(251, 255, 0);
        }

        input[type="number"] {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
            margin-left: 100px;
        }

        .td{
            padding-left: 100px;
            font-weight: bold;
        }

        .cm{
            padding-left: 100px;
            font-weight: bold;
        }
        .pp{
            padding-left: 100px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-left:130px;
        }

        button:hover {
            background-color: #1acc23;
        }

        h3 {
            margin-top: 20px;
        }
    </style>
</head>
<body>
  <div class="container">
    <h2>Car Fuel Cost Calculator</h2>

    <label class="td">Travel Distance (KM):</label><br>
    <input type="number" id="distance" placeholder="Enter distance">
    <br><br>

    <label class="cm">Car Mileage (KM/L):</label><br>
    <input type="number" id="mileage" placeholder="Enter mileage">
    <br><br>

    <label class="pp">Petrol Price (₹/L):</label><br>
    <input type="number" id="price" placeholder="Enter petrol price">
    <br><br>

    <button onclick="calculateCost()">Calculate Cost</button>

    <h3 id="result"></h3>
    </div>

    <script>
        function calculateCost() {
            let distance = Number(
                document.getElementById("distance").value
            );

            let mileage = Number(
                document.getElementById("mileage").value
            );

            let price = Number(
                document.getElementById("price").value
            );

            let result = document.getElementById("result");

            if (
                document.getElementById("distance").value === "" ||
                document.getElementById("mileage").value === "" ||
                document.getElementById("price").value === "" ||
                !Number.isFinite(distance) ||
                !Number.isFinite(mileage) ||
                !Number.isFinite(price) ||
                distance <= 0 || mileage <= 0 || price <= 0
            ) {
                result.innerText = "Please enter valid values!";
                return;
            }

            let fuel = distance / mileage;
            let cost = fuel * price;

            result.innerHTML =
                "Distance: " + distance + " KM" +
                "<br>Fuel Required: " + fuel.toFixed(2) + " Litres" +
                "<br>Total Trip Cost: ₹" + cost.toFixed(2);
        }
    </script>

</body>
</html>
