
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #243047;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1, h2 {
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .card, .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
        }

        .card p {
            margin-bottom: 5px;
        }

        .card h2 {
            margin-top: 10px;
            overflow-wrap: anywhere;
        }

        .income {
            color: #16804a;
        }

        .expense {
            color: #d62828;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            background: #2457c5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .full {
            grid-column: 1 / -1;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        .delete {
            background: #c62828;
            padding: 8px;
        }

        #message {
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            form, .filters {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Expense Tracker Pro</h1>
    <p style="text-align:center">
        Manage your income, expenses and savings.
    </p>

    <div class="cards">
        <div class="card">
            <p>Total Income</p>
            <h2 class="income" id="income">₹0.00</h2>
        </div>

        <div class="card">
            <p>Total Expenses</p>
            <h2 class="expense" id="expenses">₹0.00</h2>
        </div>

        <div class="card">
            <p>Current Balance</p>
            <h2 id="balance">₹0.00</h2>
        </div>
    </div>

    <div class="panel">
        <h2>Add Transaction</h2>

        <form id="transactionForm">
            <input type="text" id="title"
                   placeholder="Transaction title" required>

            <input type="number" id="amount"
                   placeholder="Amount in rupees"
                   min="0.01" step="0.01" required>

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <select id="category">
                <option value="Salary">Salary</option>
                <option value="Education">Education</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <input type="date" id="date" required>

            <button type="submit">Add Transaction</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="panel" style="margin-top:25px">
        <h2>Transaction History</h2>

        <div class="filters">
            <input type="search" id="search"
                   placeholder="Search transactions...">

            <select id="sort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="high">Amount: High to Low</option>
                <option value="low">Amount: Low to High</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById("transactionForm");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const searchInput = document.getElementById("search");
    const sortInput = document.getElementById("sort");
    const list = document.getElementById("transactionList");
    const message = document.getElementById("message");

    let transactions = [];

    try {
        const saved = JSON.parse(
            localStorage.getItem("expenseTransactions") || "[]"
        );

        if (Array.isArray(saved)) {
            transactions = saved.filter(function(t) {
                return t &&
                    typeof t.id === "string" &&
                    typeof t.title === "string" &&
                    typeof t.amount === "number" &&
                    Number.isFinite(t.amount) &&
                    t.amount > 0 &&
                    ["income", "expense"].includes(t.type) &&
                    typeof t.category === "string" &&
                    typeof t.date === "string";
            });
        }
    } catch (error) {
        transactions = [];
    }

    // Set today's date as the default.
    dateInput.value = new Date().toLocaleDateString("en-CA");

    function money(amount) {
        return new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR"
        }).format(amount);
    }

    function saveData() {
        try {
            localStorage.setItem(
                "expenseTransactions",
                JSON.stringify(transactions)
            );
        } catch (error) {
            message.textContent =
                "Unable to save data in this browser.";
        }
    }

    function updateSummary() {
        const income = transactions
            .filter(t => t.type === "income")
            .reduce((sum, t) => sum + t.amount, 0);

        const expenses = transactions
            .filter(t => t.type === "expense")
            .reduce((sum, t) => sum + t.amount, 0);

        document.getElementById("income").textContent =
            money(income);

        document.getElementById("expenses").textContent =
            money(expenses);

        const balance = income - expenses;
        const balanceElement = document.getElementById("balance");

        balanceElement.textContent = money(balance);
        balanceElement.className =
            balance < 0 ? "expense" : "income";
    }

    function displayTransactions() {
        const keyword = searchInput.value.toLowerCase();

        let filtered = transactions.filter(function(t) {
            return t.title.toLowerCase().includes(keyword) ||
                   t.category.toLowerCase().includes(keyword) ||
                   t.type.toLowerCase().includes(keyword);
        });

        if (sortInput.value === "newest") {
            filtered.sort((a, b) =>
                b.date.localeCompare(a.date) ||
                b.id.localeCompare(a.id)
            );
        } else if (sortInput.value === "oldest") {
            filtered.sort((a, b) =>
                a.date.localeCompare(b.date) ||
                a.id.localeCompare(b.id)
            );
        } else if (sortInput.value === "high") {
            filtered.sort((a, b) => b.amount - a.amount);
        } else {
            filtered.sort((a, b) => a.amount - b.amount);
        }

        list.replaceChildren();

        if (filtered.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 6;
            cell.textContent = "No transactions found.";

            row.appendChild(cell);
            list.appendChild(row);
            return;
        }

        filtered.forEach(function(t) {
            const row = document.createElement("tr");

            [
                t.title,
                t.category,
                t.date,
                t.type,
                (t.type === "income" ? "+" : "-") +
                    money(t.amount)
            ].forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.addEventListener("click", function() {
                transactions = transactions.filter(
                    item => item.id !== t.id
                );

                saveData();
                updateSummary();
                displayTransactions();

                message.textContent = "Transaction deleted.";
            });

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            list.appendChild(row);
        });
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = titleInput.value.trim();
        const amount = Number(amountInput.value);
        const type = typeInput.value;
        const category = categoryInput.value;
        const date = dateInput.value;

        if (!title || !Number.isFinite(amount) || amount <= 0) {
            message.textContent =
                "Enter a valid title and positive amount.";
            return;
        }

        if (!date || !["income", "expense"].includes(type)) {
            message.textContent = "Enter valid transaction details.";
            return;
        }

        transactions.push({
            id: crypto.randomUUID(),
            title: title,
            amount: Math.round(amount * 100) / 100,
            type: type,
            category: category,
            date: date
        });

        saveData();
        updateSummary();
        displayTransactions();

        form.reset();
        dateInput.value = new Date().toLocaleDateString("en-CA");
        message.textContent = "Transaction added successfully!";
    });

    searchInput.addEventListener("input", displayTransactions);
    sortInput.addEventListener("change", displayTransactions);

    updateSummary();
    displayTransactions();
</script>

</body>
</html>
