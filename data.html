
<!DOCTYPE html>
<html>
<head>
    <title>Data Usage Calculator</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #b79f9f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Mobile Data Calculator</h2>

    <label>Total Data (GB):</label>
    <input type="number" id="total" placeholder="Example: 2">

    <br><br>

    <label>Used Data (GB):</label>
    <input type="number" id="used" placeholder="Example: 1.2">

    <br><br>

    <button onclick="calculateData()">Check Data</button>

    <h3 id="result"></h3>
    </div>

    <script>
        function calculateData() {

            let total = Number(document.getElementById("total").value);
            let used = Number(document.getElementById("used").value);

            if (total <= 0 || used < 0 || used > total) {
                document.getElementById("result").innerHTML =
                    "Please enter valid data!";
                return;
            }

            let remaining = total - used;
            let percentage = (used / total) * 100;

            document.getElementById("result").innerHTML =
                "Remaining Data: " + remaining.toFixed(2) + " GB<br>" +
                "Data Used: " + percentage.toFixed(1) + "%";
        }
    </script>

</body>
</html>
