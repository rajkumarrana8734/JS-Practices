
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Practice: Task Tracker</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 450px;
    }

    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    select, button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-add {
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .filter-btn {
      background: #e4e6eb;
      color: #333;
      flex: 1;
    }

    .filter-btn.active {
      background: #007bff;
      color: white;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      margin-bottom: 8px;
      border-radius: 5px;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #888;
    }

    .priority-High {
      border-left: 5px solid #dc3545;
    }

    .priority-Low {
      border-left: 5px solid #28a745;
    }

    .actions button {
      background: #dc3545;
      color: white;
      padding: 5px 8px;
      font-size: 12px;
    }

    .stats {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Task Tracker</h2>

  <!-- Task Input Form -->
  <div class="input-section">

    <input
      type="text"
      id="taskTitle"
      placeholder="Enter task name..."
    >

    <select id="taskPriority">
      <option value="Low">Low</option>
      <option value="High">High</option>
    </select>

    <button class="btn-add" id="addTaskBtn">Add</button>

  </div>

  <!-- Filter Buttons -->
  <div class="filters" id="filterContainer">

    <button class="filter-btn active" data-filter="all">
      All
    </button>

    <button class="filter-btn" data-filter="pending">
      Pending
    </button>

    <button class="filter-btn" data-filter="completed">
      Completed
    </button>

  </div>

  <!-- Task List -->
  <ul class="task-list" id="taskList"></ul>

  <!-- Statistics Section -->
  <div class="stats">

    <span>
      Total Tasks:
      <strong id="totalCount">0</strong>
    </span>

    <span>
      Completed:
      <strong id="completedCount">0</strong>
    </span>

  </div>

</div>

<script>

  // 1. Data Structure (Array of Objects)

  let tasks = [
    {
      id: 1,
      title: "Practice JavaScript",
      priority: "High",
      completed: false
    },

    {
      id: 2,
      title: "Revise DOM Events",
      priority: "Low",
      completed: true
    }
  ];

  let currentFilter = "all";


  // Select DOM Elements

  const taskTitleInput =
    document.getElementById("taskTitle");

  const taskPrioritySelect =
    document.getElementById("taskPriority");

  const addTaskBtn =
    document.getElementById("addTaskBtn");

  const taskListEl =
    document.getElementById("taskList");

  const filterContainer =
    document.getElementById("filterContainer");

  const totalCountEl =
    document.getElementById("totalCount");

  const completedCountEl =
    document.getElementById("completedCount");


  // 2. Render Function (Core Logic)

  function render() {

    // A. Filter the tasks using Array.prototype.filter

    const filteredTasks = tasks.filter(task => {

      if (currentFilter === "pending") {
        return !task.completed;
      }

      if (currentFilter === "completed") {
        return task.completed;
      }

      return true; // Show all tasks

    });


    // B. Update the DOM using Array.prototype.map

    taskListEl.innerHTML = filteredTasks.map(task => `

      <li
        class="task-item priority-${task.priority} ${task.completed ? 'completed' : ''}"
        data-id="${task.id}"
      >

        <div>

          <input
            type="checkbox"
            class="toggle-check"
            ${task.completed ? 'checked' : ''}
          >

          <span>
            ${task.title} (${task.priority})
          </span>

        </div>

        <div class="actions">

          <button class="btn-delete">
            Delete
          </button>

        </div>

      </li>

    `).join("");


    // C. Calculate statistics using Array.prototype.reduce

    const total = tasks.length;

    const completed = tasks.reduce(
      (acc, task) => task.completed ? acc + 1 : acc,
      0
    );


    totalCountEl.textContent = total;

    completedCountEl.textContent = completed;

  }


  // 3. Add Task Event

  addTaskBtn.addEventListener("click", () => {

    const title = taskTitleInput.value.trim();

    const priority = taskPrioritySelect.value;


    if (!title) {
      return alert("Please enter a task name!");
    }


    // Add a new task object to the array

    tasks.push({

      id: Date.now(), // Generate a unique ID

      title: title,

      priority: priority,

      completed: false

    });


    taskTitleInput.value = "";

    render();

  });


  // 4. Event Delegation for Delete and Checkbox

  taskListEl.addEventListener("click", (e) => {

    const target = e.target;

    const taskItem = target.closest(".task-item");

    if (!taskItem) return;


    const taskId = Number(taskItem.dataset.id);


    // Delete Button Click

    if (target.classList.contains("btn-delete")) {

      tasks = tasks.filter(
        task => task.id !== taskId
      );

      render();

    }


    // Checkbox Click - Toggle Completion Status

    else if (
      target.classList.contains("toggle-check")
    ) {

      const task = tasks.find(
        t => t.id === taskId
      );


      if (task) {

        task.completed = !task.completed;

        render();

      }

    }

  });


  // 5. Filter Buttons Event Delegation

  filterContainer.addEventListener("click", (e) => {

    if (e.target.classList.contains("filter-btn")) {


      // Update the active button

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });


      e.target.classList.add("active");


      // Change the current filter

      currentFilter =
        e.target.dataset.filter;


      render();

    }

  });


  // Initial Render

  render();

</script>

</body>
</html>
