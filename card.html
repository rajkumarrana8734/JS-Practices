<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card Form</title>
  <style>
    /* Card aur Profile ke basic styles taaki output image jaisa dikhe */
    #main {
      margin-top: 20px;
    }

    .card {
      border: 1px solid #000;
      width: 200px;
      padding: 10px;
      margin-top: 10px;
    }

    .profile img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .card h3 {
      margin: 8px 0 4px;
      font-size: 16px;
    }

    .card h5 {
      margin: 0 0 6px;
      font-size: 13px;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <form>
    Picture: <br>
    <input type="text" placeholder="Image URL"> <br>

    Name: <br>
    <input type="text" placeholder="Name"> <br>

    Occupation: <br>
    <input type="text" placeholder="Occupation"> <br>

    About: <br>
    <input type="text" placeholder="About"> <br>

    <input type="submit" value="Submit">
  </form>

  <div id="main"></div>

  <script src="card.js"></script>
</body>
</html>
