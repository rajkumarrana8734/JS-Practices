<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .products {
            display: flex;
            gap: 20px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            width: 150px;
        }

        .cart {
            margin-top: 30px;
            border: 2px solid black;
            padding: 20px;
            width: 400px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        button {
            cursor: pointer;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <h1>Products</h1>

    <div class="products" id="products"></div>

    <div class="cart">

        <h2>Shopping Cart</h2>

        <div id="cartItems"></div>

        <p id="emptyMessage">Your cart is empty</p>

        <hr>

        <h3>Total Items: <span id="totalItems">0</span></h3>

        <h3>Total Price: ₹<span id="totalPrice">0</span></h3>

        <button id="clearBtn">Clear Cart</button>

    </div>


    <script>

        // Product data
        let products = [
            {
                id: 1,
                name: "Laptop",
                price: 50000
            },
            {
                id: 2,
                name: "Keyboard",
                price: 1500
            },
            {
                id: 3,
                name: "Mouse",
                price: 800
            }
        ];


        // Cart
        let cart = [];


        // DOM elements
        let productsContainer = document.getElementById("products");
        let cartItems = document.getElementById("cartItems");
        let totalItems = document.getElementById("totalItems");
        let totalPrice = document.getElementById("totalPrice");
        let emptyMessage = document.getElementById("emptyMessage");
        let clearBtn = document.getElementById("clearBtn");


        // Display products
        function displayProducts() {

            productsContainer.innerHTML = "";

            products.forEach(function(product) {

                let div = document.createElement("div");

                div.classList.add("product");

                div.innerHTML = `
                    <h3>${product.name}</h3>

                    <p>₹${product.price}</p>

                    <button class="addBtn" data-id="${product.id}">
                        Add to Cart
                    </button>
                `;

                productsContainer.append(div);

            });
        }


   
        function addToCart(id) {

            let product = products.find(function(product) {
                return product.id === id;
            });


            let existingProduct = cart.find(function(item) {
                return item.id === id;
            });


            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });

            }


            displayCart();
        }


        // Display cart
        function displayCart() {

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                emptyMessage.style.display = "block";

            } else {

                emptyMessage.style.display = "none";

            }


            cart.forEach(function(item) {

                let div = document.createElement("div");

                div.classList.add("cart-item");

                div.innerHTML = `

                    <div>
                        <strong>${item.name}</strong>
                        <br>

                        ₹${item.price} × ${item.quantity}
                    </div>

                    <div>

                        <button class="minusBtn" data-id="${item.id}">
                            -
                        </button>

                        <span>${item.quantity}</span>

                        <button class="plusBtn" data-id="${item.id}">
                            +
                        </button>

                        <button class="removeBtn" data-id="${item.id}">
                            Remove
                        </button>

                    </div>

                `;

                cartItems.append(div);

            });


            calculateTotal();

        }



        function calculateTotal() {

            let items = 0;
            let price = 0;


            cart.forEach(function(item) {

                items += item.quantity;

                price += item.price * item.quantity;

            });


            totalItems.textContent = items;

            totalPrice.textContent = price;

        }



        cartItems.addEventListener("click", function(event) {

            let id = Number(event.target.dataset.id);


            // Plus
            if (event.target.classList.contains("plusBtn")) {

                let product = cart.find(function(item) {
                    return item.id === id;
                });

                product.quantity++;

            }


           
            if (event.target.classList.contains("minusBtn")) {

                let product = cart.find(function(item) {
                    return item.id === id;
                });

                product.quantity--;


                if (product.quantity === 0) {

                    cart = cart.filter(function(item) {
                        return item.id !== id;
                    });

                }

            }


            // Remove
            if (event.target.classList.contains("removeBtn")) {

                cart = cart.filter(function(item) {
                    return item.id !== id;
                });

            }


            displayCart();

        });


        productsContainer.addEventListener("click", function(event) {

            if (event.target.classList.contains("addBtn")) {

                let id = Number(event.target.dataset.id);

                addToCart(id);

            }

        });


        // Clear cart
        clearBtn.addEventListener("click", function() {

            cart = [];

            displayCart();

        });


        // Initial display
        displayProducts();

        displayCart();

    </script>

</body>
</html>
