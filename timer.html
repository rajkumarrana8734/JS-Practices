<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background:linear-gradient(0deg,rgb(86, 86, 230),rgb(213, 213, 86));
        }

        .box{
            width: 400px;
            height: 0 auto;
            background-color: #944040;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            
        }

        .btn{
            padding-left:20px;
            padding-right:20px;
            background-color: #fff;
            border-radius: 5px;
            font-size: 20px;
            background-color: aqua;
    
        }

        .btn:hover{
            background-color:rgb(95, 172, 172);
        }
        .timer{
            font-size: 50px;
            color: #fff;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Timer left</h1>
        <div class="timer"></div>
        <button class="btn">click</button>
    </div>

    <script>
        let timer = document.querySelector('.timer');
        let btn = document.querySelector('.btn');

        btn.addEventListener('click', function(){
            let time = 10;
            let interval = setInterval(function(){
                timer.innerHTML = time;
                time--;
                if(time < 0){
                    clearInterval(interval);
                    timer.innerHTML = "Time's up!";
                }
            }, 1000);
        });
  
</script>
</body>
</html>
