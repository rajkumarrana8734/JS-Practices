<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

     *{
        padding:0;
        margin:0;
        box-sizing: border-box;
        color:white;
     }

     #box{
         width:100%;
         height:50px;
         background-color: rgb(23, 28, 33);
         display:flex;
         justify-content: space-evenly;
         align-items: center;

     }

     #box a{
        text-decoration: none;
        text-shadow: 0px 5px 10px white;
     }
     a:hover{
       text-decoration: none;
     }

     button{
        color:black;
        padding-left:20px;
        padding-right:20px;
        background-color: red;
     }
    </style>
</head>
<body>
     <div id="box">
        <a href="#">Home</a>
        <a href="#">About</a>
        <button>click Me</button>
     </div>

    <script src="nr.js"></script>
</body>
</html>
