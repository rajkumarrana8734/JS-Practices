<body>
    

    <script>
        const pr  = new Promise( function (res,rej){ 
        setTimeout(() => {
           let rn = Math.floor(Math.random()*10);
           if(rn > 5){
            res("resolved eith" +  rn);}
        else{
            rej("rejected with" +  rn);
        }
           }
        , 2000);
        });

        pr.then((data) => {
            console.log(data);
        })
        .catch((err) => {
            console.log(err);
        })
    </script>
