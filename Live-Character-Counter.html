<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>
    <style>
        body{
            margin:70px;
            background-color:rgb(196, 41, 33);    
        }
        h2{
            font-size: 50px;
        }
        #text{
          
            font-size: 30px;
            background-color: rgb(241, 216, 53);
        }
        p{
            font-size: 30px;
        }
        #count{
            color:rgb(0, 0, 0)
        }
    </style>
</head>
<body>
    
    <h2>Live Character Counter</h2>

    <textarea id="text" rows="5" cols="30" placeholder="Type here..."></textarea>

    <p>Characters: <span id="count">0</span></p>
    <script src="Live-Character-Counter.js"></script>
</body>
</html>
